<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Input Methods</title>
</head>
<body>

<h2>JavaScript Input Methods Demo</h2>


<label>Enter your name: </label>
<input type="text" id="nameInput">
<button onclick="getInput()">Submit</button>

<p id="result"></p>

<script>
    
    let age = prompt("Enter your age:");
    console.log("Age (from prompt): " + age);

    let answer = confirm("Are you a student");
    console.log("Student (from confirm): " + answer);

    function getInput() {
        let name = document.getElementById("nameInput").value;
        document.getElementById("result").innerHTML =
            "Name (from text box): " + name;
    }
</script>

</body>
</html>
