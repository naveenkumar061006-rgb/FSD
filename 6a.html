<!DOCTYPE html>
<html>
<head>
    <title>Internal and External JS</title>

    <script>
        function internalJS() {
            alert("This is Internal JavaScript");
        }
    </script>

    <script>
        function externalJS() {
            alert("This is External JavaScript");
        }
    </script>

</head>
<body>

    <h3>JavaScript Example</h3>

    <button onclick="internalJS()">This is Internal java script</button>
    <button onclick="externalJS()">This is external java script</button>

</body>
</html>
