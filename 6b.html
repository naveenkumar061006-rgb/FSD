<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Output Methods</title>
</head>
<body>

<h2>JavaScript Output Methods Demo</h2>

<p id="demo"></p>

<script>
    console.log("This is console.log output");

    alert("This is alert output");


    document.write("<h3>This is document.write output</h3>");

    document.getElementById("demo").innerHTML = "This is innerHTML output";

    let age = 20;
    let marks = 85.5;

    console.log("Age: " + age);
    document.write("<p>Marks: " + marks + "</p>");
</script>

</body>
</html>
